<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resiguard — Coming Soon</title>
  <meta name="description" content="Resiguard home fire sprinkler systems are coming to resiguard.co.nz — protecting New Zealand rural homes. Check back soon." />
  <meta name="robots" content="index, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&family=Work+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:       #2A9D8F;
      --teal-light: #3BB8A8;
      --navy:       #2C4A62;
      --navy-card:  #375873;
      --orange:     #F4A261;
      --text:       #E8F4F2;
      --muted:      #8BBDD0;
      --border:     rgba(42, 157, 143, 0.3);
    }

    html, body {
      height: 100%;
      font-family: 'Outfit', system-ui, sans-serif;
      background: var(--navy);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ── Canvas background ── */
    #bg-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Layout ── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 5rem;
    }

    /* ── Logo ── */
    .brand {
      margin-bottom: 3.5rem;
      animation: fadeDown 0.8s ease both;
    }

    .brand-logo {
      height: 80px;
      width: auto;
      display: block;
      filter: brightness(1.15);
    }

    /* ── Hero text ── */
    .hero {
      text-align: center;
      max-width: 680px;
      animation: fadeUp 0.9s 0.2s ease both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(42, 157, 143, 0.12);
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--teal-light);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.75rem;
    }

    .badge-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--teal);
      animation: pulse-dot 2s infinite;
    }

    h1 {
      font-size: clamp(2.4rem, 8vw, 5rem);
      font-weight: 900;
      line-height: 1.05;
      letter-spacing: -0.04em;
      margin-bottom: 1.25rem;
    }

    h1 span {
      background: linear-gradient(135deg, var(--teal-light) 0%, #A8EDEA 50%, var(--orange) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      font-family: 'Work Sans', system-ui, sans-serif;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.65;
      max-width: 520px;
      margin: 0 auto 2.75rem;
    }



    /* ── Footer ── */
    footer {
      position: absolute;
      bottom: 1.5rem;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(127, 174, 192, 0.5);
      font-family: 'Work Sans', system-ui, sans-serif;
      animation: fadeUp 0.9s 0.6s ease both;
    }

    footer a {
      color: var(--teal);
      text-decoration: none;
    }

    footer a:hover { text-decoration: underline; }

    /* ── Animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.7); }
    }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .brand-logo { height: 52px; }
      .status-row { gap: 0.6rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>

<canvas id="bg-canvas" aria-hidden="true"></canvas>

<div class="page">

  <!-- Logo -->
  <div class="brand">
    <img
      class="brand-logo"
      src="sites/landing-page-tanks/images/Resiguard-logo.png"
      alt="Resiguard"
    />
  </div>

  <!-- Hero -->
  <div class="hero">
    <div class="badge">
      <span class="badge-dot" aria-hidden="true"></span>
      Under Development
    </div>

    <h1>Something<br /><span>big is coming.</span></h1>

    <p class="subtitle">
      We're building the home fire sprinkler solution for New Zealand homes.
      Our website is under construction — check back shortly.
    </p>
  </div>

  <footer>
    <p>&copy; 2025 Resiguard Ltd &nbsp;·&nbsp; <a href="mailto:info@resiguard.co.nz">info@resiguard.co.nz</a></p>
  </footer>

</div>

<script>
  /* ─── Particle canvas ─── */
  (function() {
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, particles;

    const COLORS = ['rgba(42,157,143,', 'rgba(59,184,168,', 'rgba(168,237,234,', 'rgba(26,95,122,'];

    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }

    function makeParticle() {
      return {
        x: Math.random() * W,
        y: Math.random() * H,
        r: Math.random() * 1.8 + 0.4,
        alpha: Math.random() * 0.5 + 0.1,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        color: COLORS[Math.floor(Math.random() * COLORS.length)]
      };
    }

    function init() {
      resize();
      const count = Math.min(Math.floor(W * H / 8000), 120);
      particles = Array.from({ length: count }, makeParticle);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      const grad = ctx.createRadialGradient(W * 0.5, H * 0.4, 0, W * 0.5, H * 0.4, Math.max(W, H) * 0.7);
      grad.addColorStop(0, 'rgba(13,27,42,0)');
      grad.addColorStop(1, 'rgba(13,27,42,0.6)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);

      particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = p.color + p.alpha + ')';
        ctx.fill();

        p.x += p.vx;
        p.y += p.vy;
        if (p.x < -5) p.x = W + 5;
        if (p.x > W + 5) p.x = -5;
        if (p.y < -5) p.y = H + 5;
        if (p.y > H + 5) p.y = -5;
      });

      requestAnimationFrame(draw);
    }

    window.addEventListener('resize', () => { resize(); });
    init();
    draw();
  })();
</script>

</body>
</html>
